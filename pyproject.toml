[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telltale"
version = "0.7.0"
description = "Measurement harness for federated aggregation integrity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
flower = ["flwr"]
nvflare = ["nvflare[PT]>=2.7.3"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "ruff"]

[tool.setuptools.packages.find]
include = ["telltale*"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN"]
ignore = [
    "ANN401",  # Any is sometimes the honest type
    "D105",    # magic methods are self-describing
    "D107",    # __init__ args are documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["E402", "D103", "ANN"]
"paper/*" = ["E501"]  # LaTeX caption strings
