[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN"]
ignore = [
    "ANN401",  # Any is sometimes the honest type
    "D105",    # magic methods are self-describing
    "D107",    # __init__ args are documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["E402", "D103", "ANN"]
